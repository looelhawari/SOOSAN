<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Big Expanding Image Stack</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f8f9fa;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .image-stack {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .image-box {
            position: relative;
            width: 360px;
            height: 520px;
            border-radius: 28px;
            overflow: hidden;
            margin-left: -180px;
            transition: transform 0.4s ease, z-index 0.3s ease;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            flex-shrink: 0;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .image-box .info {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 18px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .image-box:hover {
            transform: scale(1.4);
            z-index: 10;
        }

        .image-box:hover .info {
            opacity: 1;
        }

        @media (max-width: 1400px) {
            body {
                padding-top: 80px;
            }

            .image-stack {
                overflow-x: auto;
                padding-left: 100px;
                padding-right: 100px;
            }

            .image-box {
                margin-left: -160px;
            }

            .image-stack::-webkit-scrollbar {
                height: 8px;
            }

            .image-stack::-webkit-scrollbar-thumb {
                background: #bbb;
                border-radius: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="image-stack">
        <div class="image-box">
            <img src="https://source.unsplash.com/700x1000/?forest" alt="Forest">
            <div class="info">
                <h3>Peaceful Forest</h3>
                <p>Relaxing green nature vibes.</p>
            </div>
        </div>
        <div class="image-box">
            <img src="https://source.unsplash.com/700x1000/?mountain" alt="Mountain">
            <div class="info">
                <h3>Mountain View</h3>
                <p>Reach the peaks of calmness.</p>
            </div>
        </div>
        <div class="image-box">
            <img src="https://source.unsplash.com/700x1000/?city" alt="City">
            <div class="info">
                <h3>Urban Life</h3>
                <p>The rhythm of busy streets.</p>
            </div>
        </div>
        <div class="image-box">
            <img src="https://source.unsplash.com/700x1000/?stars" alt="Stars">
            <div class="info">
                <h3>Starry Night</h3>
                <p>Look beyond the sky and dream.</p>
            </div>
        </div>
    </div>

</body>

</html>
